services:
  postgres:
    image: postgres:16-alpine
    hostname: tutor-matcher-postgres
    environment:
      POSTGRES_DB: tutor_matcher
      POSTGRES_USER: postgres
    env_file:
      - ./secrets/postgres.enc.env
    volumes:
      - tutor_matcher_postgres_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-tutor_matcher}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      update_config:
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: any

  frontend:
    image: docker.io/azther0z/tutor-matcher-frontend:latest
    build:
      context: ../apps/frontend
      args:
        # Next.js compiles this service address into the standalone image.
        BACKEND_URL: http://backend:8000
    hostname: tutor-matcher-frontend
    environment:
      PORT: "3000"
    ports:
      - target: 3000
        published: 3333
        protocol: tcp
    networks:
      - default
    deploy:
      replicas: 1
      update_config:
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: any

  backend:
    image: docker.io/azther0z/tutor-matcher-backend:latest
    build:
      context: ../apps/backend
    hostname: tutor-matcher-backend
    env_file:
      - ./secrets/backend.enc.env
    environment:
      PORT: "8000"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3333}"
    ports:
      - "8000:8000"
    networks:
      - default
    deploy:
      replicas: 1
      update_config:
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: any

volumes:
  tutor_matcher_postgres_data:

networks:
  default: {}
