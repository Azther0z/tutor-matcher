services:
  postgres:
    image: postgres:16-alpine
    hostname: tutor-matcher-postgres
    environment:
      POSTGRES_DB: tutor_matcher
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - tutor_matcher_postgres_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-tutor_matcher}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      update_config:
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: any

  frontend:
    image: docker.io/azther0z/tutor-matcher-frontend:latest
    hostname: tutor-matcher-frontend
    environment:
      PORT: "3000"
    labels:
      observability.logs: "true"
    ports:
      - target: 3000
        published: 3333
        protocol: tcp
    networks:
      - default
      - observability
    deploy:
      replicas: 1
      update_config:
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: any

  backend:
    image: docker.io/azther0z/tutor-matcher-backend:latest
    hostname: tutor-matcher-backend
    environment:
      DATABASE_URL_FILE: /run/secrets/backend_database_url
      PORT: "3001"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3333}"
    secrets:
      - backend_database_url
    ports:
      - "3001:3001"
    networks:
      - default
      - observability
    deploy:
      replicas: 1
      update_config:
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: any

volumes:
  tutor_matcher_postgres_data:

secrets:
  backend_database_url:
    file: ./secrets/backend_database_url.enc
  postgres_password:
    file: ./secrets/postgres_password.enc

networks:
  default: {}
  observability:
    external: true
