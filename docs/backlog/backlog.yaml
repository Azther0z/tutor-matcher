format_version: 1
source_policy: Original HTML and SVG sources are immutable; YAML is the editable planning authority.
epics:
  - id: EPIC-1
    acronym: AUTH
    name: "Account Registration & Authentication"
  - id: EPIC-2
    acronym: PROF
    name: "User Profile Management"
  - id: EPIC-3
    acronym: DISC
    name: "Tutor Search & Discovery"
  - id: EPIC-4
    acronym: BOOK
    name: "Lesson Booking & Scheduling"
  - id: EPIC-5
    acronym: PAY
    name: "Payments & Billing"
  - id: EPIC-6
    acronym: CLASS
    name: "Virtual Classroom & Lesson Delivery"
  - id: EPIC-7
    acronym: MSG
    name: "Messaging & Notifications"
  - id: EPIC-8
    acronym: REV
    name: "Reviews & Ratings"
  - id: EPIC-9
    acronym: SAFE
    name: "Admin, Trust & Safety"
sources:
  - file: ../sources/Product Backlog v1.2.html
    kind: product-backlog
  - file: ../sources/Sprint 1 v1.1.html
    kind: sprint-backlog
  - file: ../sources/Untitled-2026-08-28-2348.svg
    kind: user-journey
journey_coverage:
  source: ../sources/Untitled-2026-08-28-2348.svg
  notes:
    - "Coverage maps meaningful route/action pairs; SVG labels are not automatically product stories."
    - "Implementation and navigation details are classified as non-story."
    - "Independent journey gaps are invitations, payment method, and tutor stats/engagement."
  entries:
    - classification: story
      route: "(auth)/signup"
      action: "Sign up"
      story_ids: [AUTH-1, AUTH-5, AUTH-6]
    - classification: story
      route: "(auth)/Login"
      action: "Login"
      story_ids: [AUTH-2]
    - classification: story
      route: "(auth)/Login"
      action: "Reset password"
      story_ids: [AUTH-3]
    - classification: story
      route: "(auth)/enroll-tutor"
      action: "Upload ID, certification"
      story_ids: [AUTH-4]
    - classification: story
      route: "/booking"
      action: "Booking"
      story_ids: [BOOK-1, BOOK-2, BOOK-3, BOOK-4]
    - classification: story
      route: "/bookings/:id"
      action: "View booking"
      story_ids: [BOOK-1, BOOK-2, BOOK-3, BOOK-4]
    - classification: story
      route: "/booking"
      action: "Invite classmate"
      story_ids: [BOOK-5]
    - classification: story
      route: "/booking"
      action: "Accept invite"
      story_ids: [BOOK-6]
    - classification: story
      route: "/bookings/:id"
      action: "Get zoom meeting link"
      story_ids: [CLASS-1]
    - classification: story
      route: "/bookings/:id"
      action: "booking status"
      story_ids: [CLASS-2]
    - classification: story
      route: "/search"
      action: "Search & Browse Tutors"
      story_ids: [DISC-1, DISC-2]
    - classification: story
      route: "/tutors/:id"
      action: "Tutor Profile Detail"
      story_ids: [DISC-3]
    - classification: story
      route: "/tutors/:id"
      action: "Message this tutor"
      story_ids: [MSG-1]
    - classification: story
      route: "/settings/notification"
      action: "Notification settings"
      story_ids: [MSG-2]
    - classification: story
      route: "/topup"
      action: "Topup"
      story_ids: [PAY-1]
    - classification: story
      route: "/payments"
      action: "View earning"
      story_ids: [PAY-2]
    - classification: story
