    </script>
    <script>
      const data = JSON.parse(document.getElementById("backlog-data").textContent);
      const sprintExecution = new Map(data.sprint.stories.map((story) => [story.id, story]));
      data.product = data.product.map((story) => {
        const execution = sprintExecution.get(story.id);
        return execution
          ? {
              ...story,
              status: execution.status,
              order: execution.order,
              estimate_hours: execution.hours,
              assignees: execution.assignees,
              tasks: execution.tasks,
            }
          : story;
      });
      let view = "product";
      let selectedSprint = "";
      const dependencies = data.dependencies;
      const $ = (id) => document.getElementById(id);
      const sprintStories = new Set(data.sprint.stories.map((story) => story.id));
      const sprintLabel = (story) =>
        sprintStories.has(story.id) ? data.sprint.label : "Unscheduled";
      const esc = (value) =>
        String(value ?? "").replace(
          /[&<>"']/g,
          (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]
        );
      const refresh = () => {
        const stories = data.product;
        const query = $("search").value.toLowerCase();
        const epic = $("epic").value;
        const status = $("status").value;
        const assignee = $("assignee").value;
        const filtered = stories
          .filter((story) => {
            const text = JSON.stringify(story).toLowerCase();
            const assignees = story.assignees || [];
            return (
              (!query || text.includes(query)) &&
              (!epic || story.epic === epic) &&
              (!status || story.status === status) &&
              (!assignee || assignees.includes(assignee)) &&
              (!selectedSprint ||
                (selectedSprint === data.sprint.id && sprintStories.has(story.id)))
            );
          })
          .sort((left, right) => (selectedSprint ? Number(left.order) - Number(right.order) : 0));
        const totalPoints = stories.reduce((sum, story) => sum + Number(story.points || 0), 0);
        $("metrics").innerHTML = selectedSprint
          ? `<div class="metric"><b>${data.sprint.stories.length}</b><span>sprint stories</span></div><div class="metric"><b>${data.sprint.tasks}</b><span>tasks</span></div><div class="metric"><b>${data.sprint.hours}</b><span>pair-hours</span></div><div class="metric"><b>${filtered.length}</b><span>visible now</span></div>`
          : `<div class="metric"><b>${stories.length}</b><span>product stories</span></div><div class="metric"><b>${new Set(stories.map((s) => s.epic)).size}</b><span>epics</span></div><div class="metric"><b>${totalPoints}</b><span>story points</span></div><div class="metric"><b>${filtered.length}</b><span>visible now</span></div>`;
        $("sprint-note").innerHTML =
          selectedSprint === data.sprint.id
            ? `<div class="sprint-note"><strong>${esc(data.sprint.goal)}</strong>${esc(data.sprint.start)} to ${esc(data.sprint.end)} · ${esc(data.sprint.status)}</div>`
            : "";
        $("graph-wrap").classList.toggle("visible", view === "graph");
        $("stories").style.display = view === "graph" ? "none" : "grid";
        if (view === "graph") renderGraph(filtered);
        else
          $("stories").innerHTML = filtered.length
            ? filtered.map(card).join("")
            : '<div class="empty">No stories match these filters.</div>';
      };
      const renderGraph = (stories) => {
        const svg = $("dependency-graph");
        const width = Math.max(760, Math.min(1200, stories.length * 34));
        const nodeWidth = 142,
          nodeHeight = 52,
          gapX = 34,
          gapY = 18,
          margin = 22;
        const ids = new Set(stories.map((story) => story.id));
        const level = (id, seen = new Set()) => {
          if (seen.has(id)) return 0;
          seen.add(id);
          const deps = (dependencies[id] || []).filter((dep) => ids.has(dep));
          return deps.length ? Math.max(...deps.map((dep) => level(dep, new Set(seen)))) + 1 : 0;
        };
        const columns = {};
        stories.forEach((story) => (columns[level(story.id)] ||= []).push(story));
        const columnCount = Math.max(...Object.keys(columns).map(Number), 0) + 1;
        const colWidth = Math.max(nodeWidth + gapX, (width - margin * 2) / columnCount);
        const canvasWidth = margin * 2 + colWidth * columnCount;
        const positions = {};
        Object.entries(columns).forEach(([column, items]) => {
          items.forEach((story, row) => {
            positions[story.id] = {
              x: margin + Number(column) * colWidth,
              y: margin + row * (nodeHeight + gapY),
            };
          });
        });
        const height = Math.max(
          150,
          ...Object.values(positions).map(({ y }) => y + nodeHeight + margin)
        );
        const edgeMarkup = stories
          .flatMap((story) =>
            (dependencies[story.id] || [])
              .filter((dep) => positions[dep])
              .map((dep) => {
                const from = positions[dep],
                  to = positions[story.id];
                return `<path class="graph-edge" d="M ${from.x + nodeWidth} ${from.y + nodeHeight / 2} C ${from.x + colWidth - 8} ${from.y + nodeHeight / 2}, ${to.x - 18} ${to.y + nodeHeight / 2}, ${to.x} ${to.y + nodeHeight / 2}"/>`;
              })
          )
          .join("");
        const nodeMarkup = stories
          .map((story) => {
            const { x, y } = positions[story.id];
            const title = story.title.replace(/^To /, "").replace(/^Create /, "");
            const shortTitle = title.length > 22 ? `${title.slice(0, 21)}...` : title;
            const overlay = sprintStories.has(story.id)
              ? `<rect width="${nodeWidth}" height="${nodeHeight}" rx="9" fill="#dcefeb" fill-opacity="0.72" stroke="#167d78" stroke-width="3"/>`
              : `<rect width="${nodeWidth}" height="${nodeHeight}" rx="9"/>`;
            const nodeClass = sprintStories.has(story.id) ? "graph-node sprint-node" : "graph-node";
            return `<g class="${nodeClass}" tabindex="0" role="button" aria-label="${esc(story.id)}: ${esc(story.title)} (${esc(sprintLabel(story))})" data-story="${esc(story.id)}" transform="translate(${x},${y})">${overlay}<text class="node-id" x="11" y="18">${esc(story.id)}</text><text class="node-title" x="11" y="36">${esc(shortTitle)}</text></g>`;
          })
          .join("");
        svg.setAttribute("viewBox", `0 0 ${canvasWidth} ${height}`);
        svg.setAttribute("height", height);
        svg.style.width = `${canvasWidth}px`;
        svg.innerHTML = `<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#b8c8c6"/></marker></defs>${edgeMarkup}${nodeMarkup}`;
        $("graph-count").textContent =
          `${stories.length} stories · ${edgeMarkup ? stories.reduce((count, story) => count + (dependencies[story.id] || []).filter((dep) => ids.has(dep)).length, 0) : 0} links`;
        svg.querySelectorAll("[data-story]").forEach((node) =>
          node.addEventListener("click", () => {
            view = "product";
            document
              .querySelectorAll("[data-view]")
              .forEach((item) => item.classList.toggle("active", item.dataset.view === view));
            $("search").value = node.dataset.story;
            setFilters();
            refresh();
          })
        );
      };
      const taskMarkup = (task) =>
        `<li class="task">${esc(task.title)}<small>${esc(task.role)} · ${esc(task.hours)} hrs · ${esc(task.status)} · Assignee: ${esc((task.assignees || []).join(", ") || "Unassigned")}</small></li>`;
      const card = (story) =>
        `<details class="story"><summary><span class="story-id">${esc(story.id)}</span><h2>${esc(story.title)}</h2><p>${esc(story.description || "")}</p><div class="chips"><span class="chip">${esc(story.epic || data.sprint.label)}</span><span class="chip status">${esc(story.status)}</span>${selectedSprint ? `<span class="chip">${esc(story.estimate_hours)} hrs</span>` : `<span class="chip">${esc(story.points)} pts</span>`}${story.assignees?.length ? `<span class="chip">Assignee: ${esc(story.assignees.join(", "))}</span>` : ""}</div></summary><div class="detail"><h3>Role</h3><p>${esc(story.role || "")}</p>${story.criteria ? `<h3>Acceptance criteria</h3><ul>${story.criteria.map(criterionMarkup).join("")}</ul>` : ""}${story.tasks ? `<h3>Sprint tasks</h3><ul>${story.tasks.map(taskMarkup).join("")}</ul>` : ""}</div></details>`;
      const criterionMarkup = (criterion) => {
        const parts = typeof criterion === "string" ? criterion.split(/,\s+/) : [];
        const item =
          typeof criterion === "string"
            ? {
                given: parts.shift() || "",
                when: parts.join(", ").replace(/, ([^,]*)$/, ""),
                then: parts.pop() || "",
              }
            : criterion;
        return `<li class="criterion"><div class="criterion-line"><span>Given</span><p>${esc(item.given)}</p></div><div class="criterion-line"><span>When</span><p>${esc(item.when)}</p></div><div class="criterion-line"><span>Then</span><p>${esc(item.then)}</p></div></li>`;
      };
      const setFilters = () => {
        const stories = data.product;
        $("epic").innerHTML = `<option value="">All epics</option>${[
          ...new Set(stories.map((s) => s.epic).filter(Boolean)),
        ]
          .sort()
          .map((e) => `<option>${esc(e)}</option>`)
          .join("")}`;
        $("status").innerHTML = `<option value="">All statuses</option>${[
          ...new Set(stories.map((s) => s.status)),
        ]
          .sort()
          .map((s) => `<option>${esc(s)}</option>`)
          .join("")}`;
        const assignees = [
          ...new Set(data.sprint.stories.flatMap((story) => story.assignees || [])),
        ].sort();
        $("assignee").innerHTML =
          `<option value="">All assignees</option>${assignees.map((name) => `<option>${esc(name)}</option>`).join("")}`;
        $("sprint").innerHTML =
          `<option value="">All sprints</option><option value="${esc(data.sprint.id)}">${esc(data.sprint.label)}</option>`;
        $("sprint").value = selectedSprint;
      };
      document.querySelectorAll("[data-view]").forEach((button) =>
        button.addEventListener("click", () => {
          view = button.dataset.view;
          document
            .querySelectorAll("[data-view]")
            .forEach((item) => item.classList.toggle("active", item === button));
          $("search").value = "";
          setFilters();
          refresh();
        })
      );
      $("graph-left").addEventListener("click", () => {
        $("graph-scroll").scrollLeft -= 320;
      });
      $("graph-right").addEventListener("click", () => {
        $("graph-scroll").scrollLeft += 320;
      });
      $("sprint").addEventListener("input", () => {
        selectedSprint = $("sprint").value;
        refresh();
      });
      ["search", "epic", "status", "assignee"].forEach((id) =>
        $(id).addEventListener("input", refresh)
      );
      setFilters();
      refresh();
    </script>
  </body>
</html>
