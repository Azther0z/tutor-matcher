<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tutor Matcher Backlog</title>
    <style>
      :root {
        --ink: #1d2733;
        --muted: #687585;
        --line: #dce4e8;
        --paper: #f7f9f8;
        --card: #fff;
        --accent: #d95d39;
        --teal: #167d78;
        --yellow: #f2c14e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font:
          15px/1.5 Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
      }
      header {
        padding: 42px clamp(20px, 6vw, 88px) 34px;
        background: #183642;
        color: #f7f1e8;
      }
      header h1 {
        max-width: 1100px;
        margin: 0 auto 8px;
        font:
          600 clamp(2rem, 4vw, 3.6rem)/1.05 Georgia,
          serif;
        letter-spacing: -0.04em;
      }
      header p {
        max-width: 1100px;
        margin: 0 auto;
        color: #bad0ce;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 28px clamp(20px, 6vw, 88px) 72px;
      }
      .toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 22px;
      }
      input,
      select {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 11px 13px;
        color: var(--ink);
        background: var(--card);
        font: inherit;
      }
      input {
        flex: 1 1 260px;
      }
      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 22px;
        border-bottom: 1px solid var(--line);
      }
      button {
        cursor: pointer;
        border: 0;
        border-radius: 999px;
        padding: 10px 16px;
        background: #e8efed;
        color: var(--ink);
        font: 600 13px inherit;
      }
      button.active {
        color: #fff;
        background: var(--accent);
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin-bottom: 28px;
      }
      .metric {
        padding: 17px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
      }
      .metric b {
        display: block;
        font:
          600 30px/1 Georgia,
          serif;
        color: var(--teal);
      }
      .metric span {
        color: var(--muted);
        font-size: 12px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
        gap: 14px;
      }
      .story {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        overflow: hidden;
      }
      .story summary {
        list-style: none;
        cursor: pointer;
        padding: 17px;
      }
      .story summary::-webkit-details-marker {
        display: none;
      }
      .story summary:hover {
        background: #fbfcfb;
      }
      .story-id {
        color: var(--accent);
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.06em;
      }
      .story h2 {
        margin: 7px 0 9px;
        font:
          600 20px/1.15 Georgia,
          serif;
      }
      .story p {
        margin: 0;
        color: var(--muted);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 14px;
      }
      .chip {
        padding: 4px 8px;
        border-radius: 999px;
        background: #edf4f2;
        color: var(--teal);
        font-size: 11px;
        font-weight: 700;
      }
      .chip.status {
        background: #fff3d4;
        color: #8a6500;
      }
      .detail {
        border-top: 1px solid var(--line);
        padding: 16px 17px;
        background: #fcfdfc;
      }
      .detail h3 {
        margin: 0 0 8px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .detail ul {
        margin: 0;
        padding-left: 20px;
      }
      .task {
        margin: 7px 0;
      }
      .task small {
        display: block;
        color: var(--muted);
      }
      .empty {
        padding: 40px;
        text-align: center;
        color: var(--muted);
        grid-column: 1/-1;
      }
      .sprint-note {
        margin-bottom: 22px;
        padding: 18px 20px;
        border-left: 4px solid var(--yellow);
        background: #fffdf5;
      }
      .sprint-note strong {
        display: block;
        margin-bottom: 4px;
      }
      @media (max-width: 680px) {
        .metrics {
          grid-template-columns: repeat(2, 1fr);
        }
        header {
          padding-top: 30px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Tutor Matcher backlog</h1>
      <p>A readable view of the product roadmap and Sprint 1 execution plan.</p>
    </header>
    <main>
      <nav class="tabs" aria-label="Backlog views">
        <button class="active" data-view="product">Product backlog</button
        ><button data-view="sprint">Sprint 1</button>
      </nav>
      <section class="toolbar">
        <input id="search" type="search" placeholder="Search stories, roles, or tasks" /><select
          id="epic"
        >
          <option value="">All epics</option></select
        ><select id="status">
          <option value="">All statuses</option>
        </select>
        <select id="assignee">
          <option value="">All assignees</option>
        </select>
      </section>
      <section class="metrics" id="metrics"></section>
      <section id="sprint-note"></section>
      <section class="grid" id="stories"></section>
    </main>

    <script>
      const data = JSON.parse(document.getElementById('backlog-data').textContent);
      let view = 'product';
      const $ = (id) => document.getElementById(id);
      const esc = (value) =>
        String(value ?? '').replace(
          /[&<>"']/g,
          (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]
        );
      const refresh = () => {
        const stories = view === 'product' ? data.product : data.sprint.stories;
        const query = $('search').value.toLowerCase();
        const epic = $('epic').value;
        const status = $('status').value;
        const assignee = $('assignee').value;
        const filtered = stories.filter((story) => {
          const text = JSON.stringify(story).toLowerCase();
          const assignees =
            view === 'product'
              ? data.sprint.stories.find((item) => item.id === story.id)?.assignees || []
              : story.assignees || [];
          return (
            (!query || text.includes(query)) &&
            (!epic || story.epic === epic) &&
            (!status || story.status === status) &&
            (!assignee || assignees.includes(assignee))
          );
        });
        const totalHours =
          view === 'product'
            ? stories.reduce((sum, story) => sum + Number(story.points || 0), 0)
            : stories.reduce((sum, story) => sum + Number(story.hours || 0), 0);
        $('metrics').innerHTML =
          view === 'product'
            ? `<div class="metric"><b>${stories.length}</b><span>product stories</span></div><div class="metric"><b>${new Set(stories.map((s) => s.epic)).size}</b><span>epics</span></div><div class="metric"><b>${totalHours}</b><span>story points</span></div><div class="metric"><b>${filtered.length}</b><span>visible now</span></div>`
            : `<div class="metric"><b>${stories.length}</b><span>sprint stories</span></div><div class="metric"><b>${data.sprint.tasks}</b><span>tasks</span></div><div class="metric"><b>${data.sprint.hours}</b><span>estimated hours</span></div><div class="metric"><b>${filtered.length}</b><span>visible now</span></div>`;
        $('sprint-note').innerHTML =
          view === 'sprint'
            ? `<div class="sprint-note"><strong>${esc(data.sprint.goal)}</strong>${esc(data.sprint.start)} to ${esc(data.sprint.end)} · ${esc(data.sprint.status)}</div>`
            : '';
        $('stories').innerHTML = filtered.length
          ? filtered.map(card).join('')
          : '<div class="empty">No stories match these filters.</div>';
      };
      const card = (story) =>
        `<details class="story"><summary><span class="story-id">${esc(story.id)}</span><h2>${esc(story.title)}</h2><p>${esc(story.description || '')}</p><div class="chips"><span class="chip">${esc(story.epic || 'Sprint 1')}</span><span class="chip status">${esc(story.status)}</span>${story.points ? `<span class="chip">${story.points} pts</span>` : `<span class="chip">${story.hours} hrs</span>`}</div></summary>${view === 'product' ? `<div class="detail"><h3>Role</h3><p>${esc(story.role)}</p><h3>Acceptance criteria</h3><ul>${(story.criteria || []).map((item) => `<li>${esc(item)}</li>`).join('')}</ul></div>` : `<div class="detail"><h3>Product story</h3><p>${esc(story.productPath)}</p><h3>Tasks</h3><ul>${(story.tasks || []).map((task) => `<li class="task">${esc(task.title)}<small>${esc(task.role)} · ${esc(task.hours)} hrs · ${esc(task.status)}</small></li>`).join('')}</ul></div>`}</details>`;
      const setFilters = () => {
        const stories = view === 'product' ? data.product : data.sprint.stories;
        $('epic').innerHTML = `<option value="">All epics</option>${[
          ...new Set(stories.map((s) => s.epic).filter(Boolean)),
        ]
          .sort()
          .map((e) => `<option>${esc(e)}</option>`)
          .join('')}`;
        $('status').innerHTML = `<option value="">All statuses</option>${[
          ...new Set(stories.map((s) => s.status)),
        ]
          .sort()
          .map((s) => `<option>${esc(s)}</option>`)
          .join('')}`;
        const assignees = [
          ...new Set(data.sprint.stories.flatMap((story) => story.assignees || [])),
        ].sort();
        $('assignee').innerHTML =
          `<option value="">All assignees</option>${assignees.map((name) => `<option>${esc(name)}</option>`).join('')}`;
      };
      document.querySelectorAll('[data-view]').forEach((button) =>
        button.addEventListener('click', () => {
          view = button.dataset.view;
          document
            .querySelectorAll('[data-view]')
            .forEach((item) => item.classList.toggle('active', item === button));
          $('search').value = '';
          setFilters();
          refresh();
        })
      );
      ['search', 'epic', 'status', 'assignee'].forEach((id) =>
        $(id).addEventListener('input', refresh)
      );
      setFilters();
      refresh();
    </script>
