# Reworded: docs/backlog/reconciliation.md marks this ✏️. There are no packages and no
# separate trial flow. Every booking is one subject, one continuous block, paid from the
# wallet (docs/user-journeys.md, "3 · Booking a lesson").
id: BOOK-1
title: "To book a lesson with a Tutor"
description: "As a Student, I want to book a lesson from a Tutor's published subject availability so that I can pay for a continuous block of time and have it confirmed immediately."
epic: "Lesson Booking & Scheduling"
role: "Student"
lifecycle: backlog
story_points: 5
dependencies: ["AUTH-2", "PROF-2", "PROF-3", "DISC-3"]
acceptance_criteria:
  - given: "a Student selects an open slot and pays from wallet balance,"
    when: "payment succeeds,"
    then: "the lesson is booked and confirmed immediately, and both parties are notified."
  - given: "the selected slot becomes unavailable before payment completes,"
    when: "the Student tries to pay,"
    then: "the booking is blocked and the system refreshes available slots."
sprint: sprint-1
assignees: ["Saint", "Yongfu"]
status: todo
order: 15
estimate_hours: 20
