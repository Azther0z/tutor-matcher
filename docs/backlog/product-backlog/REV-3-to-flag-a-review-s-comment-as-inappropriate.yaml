id: REV-3
title: "To flag a review's comment as inappropriate"
description: "As a user, I want to flag a review's comment as inappropriate so that Admin can review and take action on abusive or fake content."
epic: 'Reviews & Ratings'
role: 'user'
lifecycle: backlog
story_points: 2
dependencies: ['US8-1']
acceptance_criteria:
  - given: "a user is viewing a review's comment on a Tutor's profile,"
    when: 'they submit a flag with a reason,'
    then: "the comment is marked 'Flagged' and queued for Admin review."
  - given: 'a user has already flagged a specific comment,'
    when: 'they attempt to flag it again,'
    then: 'the duplicate flag is rejected.'
sources:
  - file: ../../sources/Product Backlog v1.2.html
    locator: 'Reviews & Ratings / US8-3'
journey:
  - route: '/tutors/:id'
    action: 'Review list'
