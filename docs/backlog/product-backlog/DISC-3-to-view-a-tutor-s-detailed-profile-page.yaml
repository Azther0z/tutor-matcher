id: DISC-3
title: "To view a tutor's detailed profile page"
description: "As a Student, I want to view a tutor's detailed profile page so that I can decide whether to book a lesson."
epic: "Tutor Search & Discovery"
role: "Student"
lifecycle: backlog
story_points: 2
dependencies: ["DISC-1"]
acceptance_criteria:
  - given: "a Student clicks a tutor card,"
    when: "the profile page loads,"
    then: "bio, reviews, rate, availability, AND video intro are displayed."
  - given: "a Student selects a tutor profile that is unavailable,"
    when: "the profile page loads,"
    then: "the profile details are not displayed and an unavailable message is shown."
sprint: sprint-1
assignees: ["Poom", "Pee"]
status: todo
order: 10
estimate_hours: 8
tasks:
  - id: DISC-3-T1
    title: "Design the Tutor detail page layout"
    assignees: ["Poom", "Pee"]
    role: "UXUI"
    status: todo
    estimate_hours: 2
  - id: DISC-3-T2
    title: "Build the detail page (bio, reviews, rate, availability, video)"
    assignees: ["Poom", "Pee"]
    role: "Frontend"
    status: todo
    estimate_hours: 3
  - id: DISC-3-T3
    title: "Implement the tutor-detail fetch endpoint and unavailable-profile handling"
    assignees: ["Poom", "Pee"]
    role: "Backend"
    status: todo
    estimate_hours: 2
  - id: DISC-3-T4
    title: "Write acceptance tests for the Tutor detail page"
    assignees: ["Poom", "Pee"]
    role: "QA"
    status: todo
    estimate_hours: 1

sources:
