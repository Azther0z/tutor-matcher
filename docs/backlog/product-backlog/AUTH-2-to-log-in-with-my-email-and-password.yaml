id: AUTH-2
title: "To log in with my email and password"
description: "As a member, I want to log in with my email and password so that I can access my account."
epic: "Account Registration & Authentication"
role: "member"
lifecycle: backlog
story_points: 2
dependencies: ["AUTH-1"]
acceptance_criteria:
  - given: "valid credentials,"
    when: "the member submits the login form,"
    then: "they are redirected to their dashboard."
  - given: "invalid credentials,"
    when: "the member submits the login form,"
    then: "an error message is shown without revealing whether the email exists."
sources:
  - file: ../../sources/Product Backlog v1.2.html
    locator: "Account Registration & Authentication / US1-2"
journey:
  - route: "(auth)/Login"
    action: "Login"
