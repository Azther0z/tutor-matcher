id: AUTH-3
title: "To reset my password"
description: "As a member, I want to reset my password so that I can regain access if I forget it."
epic: "Account Registration & Authentication"
role: "member"
lifecycle: backlog
story_points: 3
dependencies: ["AUTH-1"]
acceptance_criteria:
  - given: "a member requests a password reset,"
    when: "they enter a registered email,"
    then: "a time-limited reset link is emailed."
  - given: "the reset link is expired or used,"
    when: "the member opens it,"
    then: "the system shows an error and offers to resend."
sprint: sprint-1
assignees: []
status: todo
order: 2
estimate_hours: 12
tasks:
  - id: AUTH-3-T1
    title: "Design the password-reset request and confirmation pages"
    assignees: ["Ideal", "Pooh"]
    role: "UXUI"
    status: todo
    estimate_hours: 2
  - id: AUTH-3-T2
    title: "Build the reset-request form and new-password form"
    assignees: ["Poom", "Pee"]
    role: "Frontend"
    status: todo
    estimate_hours: 3
  - id: AUTH-3-T3
    title: "Generate and email a time-limited reset token"
    assignees: ["Poom", "Pee"]
    role: "Backend"
    status: todo
    estimate_hours: 2
  - id: AUTH-3-T4
    title: "Implement token validation, expiry, and resend handling"
    assignees: ["Poom", "Pee"]
    role: "Backend"
    status: todo
    estimate_hours: 3
  - id: AUTH-3-T5
    title: "Write acceptance tests for password reset (valid, expired/used link)"
    assignees: ["Nesta", "Washi"]
    role: "QA"
    status: todo
    estimate_hours: 2

sources:
  - file: ../../sources/Product Backlog v1.2.html
    locator: "Account Registration & Authentication / US1-3"
journey:
  - route: "(auth)/Login"
    action: "Reset password"
