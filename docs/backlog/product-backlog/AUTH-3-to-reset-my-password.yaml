id: AUTH-3
title: "To reset my password"
description: "As a member, I want to reset my password so that I can regain access if I forget it."
epic: "Account Registration & Authentication"
role: "member"
lifecycle: backlog
story_points: 3
dependencies: ["AUTH-1"]
acceptance_criteria:
  - given: "a member requests a password reset,"
    when: "they enter a registered email,"
    then: "a time-limited reset link is emailed."
  - given: "the reset link is expired or used,"
    when: "the member opens it,"
    then: "the system shows an error and offers to resend."
sources:
  - file: ../../sources/Product Backlog v1.2.html
    locator: "Account Registration & Authentication / US1-3"
journey:
  - route: "(auth)/Login"
    action: "Reset password"
