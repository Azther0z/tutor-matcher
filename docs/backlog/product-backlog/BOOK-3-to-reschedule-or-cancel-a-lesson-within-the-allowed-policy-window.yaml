id: BOOK-3
title: "To reschedule or cancel a lesson within the allowed policy window"
description: "As a Student, I want to reschedule or cancel a lesson within the allowed policy window so that I can handle changes in my schedule fairly."
epic: "Lesson Booking & Scheduling"
role: "Student"
lifecycle: backlog
story_points: 3
dependencies: ["BOOK-1"]
acceptance_criteria:
  - given: "a lesson is more than 24 hours away,"
    when: "a Student requests to reschedule/cancel,"
    then: "the change is applied without penalty."
  - given: "a lesson is within 24 hours,"
    when: "a Student cancels,"
    then: "the lesson credit is refunded to the Student's balance minus the cancellation fee per policy, and both parties are notified."
sources:
  - file: ../../sources/Product Backlog v1.2.html
    locator: "Lesson Booking & Scheduling / US4-3"
journey:
  - route: "/booking"
    action: "Booking"
  - route: "/bookings/:id"
    action: "View booking"
