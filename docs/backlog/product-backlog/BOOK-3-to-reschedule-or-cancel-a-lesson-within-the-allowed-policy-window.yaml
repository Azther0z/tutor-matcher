# Reworded: docs/backlog/reconciliation.md marks this ✏️. Cancel-within-policy with a
# wallet refund is real; the prototype has no reschedule flow. The window is 12 hours, not
# 24, and the refund goes to wallet balance, not "lesson credit" (docs/user-journeys.md,
# "Cancellation"). "The 12-hour window is read off prototype copy and still needs product
# sign-off" per the same page — treat the number as provisional, not final policy.
#
# Unresolved: whether reschedule should be built at all is a separate, open product
# decision (docs/backlog/reconciliation.md; issue #63 also flags this). This story does not
# decide it — it only removes reschedule from the acceptance criteria because no such flow
# exists today. BOOK-4 duplicates this story with the Tutor as actor; whether to merge them
# is also left open (see BOOK-4).
id: BOOK-3
title: "To cancel a lesson within the allowed policy window"
description: "As a Student, I want to cancel a lesson within the allowed policy window so that I can handle changes in my schedule fairly and get an eligible refund."
epic: "Lesson Booking & Scheduling"
role: "Student"
lifecycle: backlog
story_points: 3
dependencies: ["BOOK-1"]
acceptance_criteria:
  - given: "a lesson is more than 12 hours away,"
    when: "a Student cancels it,"
    then: "the cancellation is applied without penalty and the full amount is refunded to the Student's wallet balance."
  - given: "a lesson is within the 12-hour penalty window,"
    when: "a Student cancels it,"
    then: "the applicable policy is shown before confirmation, and any eligible refund is credited to the Student's wallet balance."
sprint: sprint-1
assignees: ["Saint", "Yongfu"]
status: todo
order: 16
estimate_hours: 12
