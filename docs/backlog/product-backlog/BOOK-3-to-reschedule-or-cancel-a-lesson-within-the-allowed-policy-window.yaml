    title: "Build the cancel action and policy-window messaging"
    assignees: ["Saint", "Yongfu"]
    role: "Frontend"
    status: todo
    estimate_hours: 4
  - id: BOOK-3-T2
    title: "Implement the 12-hour free-cancellation window and wallet refund logic"
    assignees: ["Saint", "Yongfu"]
    role: "Backend"
    status: todo
    estimate_hours: 6
  - id: BOOK-3-T3
    title: "Write acceptance tests for Student cancellation (both time windows)"
    assignees: ["Saint", "Yongfu"]
    role: "QA"
    status: todo
    estimate_hours: 2

