# Reworded: docs/backlog/reconciliation.md marks this ✏️. Correct, but incomplete —
# listing and document changes are submitted for admin review and go live only after
# approval (docs/user-journeys.md).
#
# Dependency fix (part of the same reconciliation pass): this story depended only on
# AUTH-1, which was accurate under the old ⛔ AUTH-1 wording ("sign up as a Tutor"). AUTH-1
# now only creates a Student account — the Tutor capability comes from an approved AUTH-4
