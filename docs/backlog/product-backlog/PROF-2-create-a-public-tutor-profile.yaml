    title: "Design the Tutor public profile page (bio, video, rate)"
    assignees: ["Saint", "Yongfu"]
    role: "UXUI"
    status: todo
    estimate_hours: 3
  - id: PROF-2-T2
    title: "Build the profile form and intro-video upload"
    assignees: ["Saint", "Yongfu"]
    role: "Frontend"
    status: todo
    estimate_hours: 6
  - id: PROF-2-T3
    title: "Implement the publish gate for required fields"
    assignees: ["Saint", "Yongfu"]
    role: "Frontend"
    status: todo
    estimate_hours: 3
  - id: PROF-2-T4
    title: "Implement profile storage and publish-to-search-index logic"
    assignees: ["Saint", "Yongfu"]
