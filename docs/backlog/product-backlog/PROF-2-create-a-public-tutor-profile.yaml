id: PROF-2
title: "Create a public tutor profile"
description: "As a Tutor, I want to create a public profile with bio, video intro, subjects, and hourly rate, and submit it for admin review, so that students can evaluate me before booking once it is approved."
epic: "User Profile Management"
role: "Tutor"
lifecycle: backlog
story_points: 5
dependencies: ["AUTH-4"]
acceptance_criteria:
  - given: "a Tutor fills in bio, subjects, rate, AND uploads an intro video, then submits for review,"
    when: "an admin approves the changes,"
    then: "the live profile updates and becomes visible in search results."
  - given: "an admin rejects the submitted changes,"
    when: "review completes,"
    then: "the existing live profile is unchanged and the Tutor sees the rejection reason."
  - given: "required fields are missing,"
    when: "the Tutor tries to submit for review,"
    then: "the system blocks submission and highlights missing fields."
sprint: sprint-1
assignees: ["Nesta", "Washi"]
status: todo
order: 8
estimate_hours: 20
tasks:
  - id: PROF-2-T1
    title: "Design the Tutor public profile page (bio, video, rate)"
    assignees: ["Nesta", "Washi"]
    role: "UXUI"
    status: todo
    estimate_hours: 3
  - id: PROF-2-T2
    title: "Build the profile form and intro-video upload"
    assignees: ["Nesta", "Washi"]
    role: "Frontend"
    status: todo
    estimate_hours: 6
  - id: PROF-2-T3
    title: "Implement the submit-for-review gate for required fields"
    assignees: ["Nesta", "Washi"]
    role: "Frontend"
    status: todo
    estimate_hours: 3
  - id: PROF-2-T4
    title: "Implement draft storage, the admin-review queue, and publish-on-approval logic"
    assignees: ["Nesta", "Washi"]
    role: "Backend"
    status: todo
    estimate_hours: 5
  - id: PROF-2-T5
    title: "Write acceptance tests for Tutor profile publishing"
    assignees: ["Nesta", "Washi"]
    role: "QA"
    status: todo
    estimate_hours: 3

sources:
