id: AUTH-5
title: "Accept privacy policy and terms"
description: "As a Student, I want to review and accept the Privacy Policy and Terms of Service during sign-up so that I understand how my personal and learning data will be used before an account is created."
epic: "Account Registration & Authentication"
role: "Student"
lifecycle: backlog
story_points: 2
dependencies: ["AUTH-1"]
acceptance_criteria:
  - given: "a Student visitor has checked the consent checkbox,"
    when: "they submit the sign-up form,"
    then: "the account is created and the consent timestamp is recorded."
  - given: "a Student visitor reaches the final sign-up step,"
    when: "they have not checked the consent checkbox,"
    then: "account creation is blocked and the requirement is highlighted."
sprint: sprint-1
assignees: ["Nesta", "Washi"]
status: todo
order: 4
estimate_hours: 8
tasks:
  - id: AUTH-5-T1
    title: "Design the consent checkbox and Privacy Policy/ToS link placement"
    assignees: ["Nesta", "Washi"]
    role: "UXUI"
    status: todo
    estimate_hours: 3
  - id: AUTH-5-T2
    title: "Implement the consent-checkbox gate on the sign-up form"
    assignees: ["Nesta", "Washi"]
    role: "Frontend"
    status: todo
    estimate_hours: 2
  - id: AUTH-5-T3
    title: "Record the consent timestamp on account creation"
    assignees: ["Nesta", "Washi"]
    role: "Backend"
    status: todo
    estimate_hours: 2
  - id: AUTH-5-T4
    title: "Write acceptance tests for the Student consent gate"
    assignees: ["Nesta", "Washi"]
    role: "QA"
    status: todo
    estimate_hours: 1

sources:
  - file: ../../sources/Product Backlog v1.2.html
    locator: "Account Registration & Authentication / US1-5"
journey:
  - route: "(auth)/signup"
    action: "Sign up"
