id: DISC-2
title: 'To view a ranked list of recommended tutors'
description: 'As a Student, I want to view a ranked list of recommended tutors so that I can quickly find a good match without extensive searching.'
epic: 'Tutor Search & Discovery'
role: 'Student'
lifecycle: backlog
story_points: 5
dependencies: ['US2-1', 'US3-1']
acceptance_criteria:
  - given: 'a Student has a profile with subjects/goals,'
    when: 'they open the discovery page,'
    then: 'a ranked list based on relevance, rating, AND availability is shown.'
