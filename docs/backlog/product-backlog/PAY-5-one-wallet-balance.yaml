# New: docs/backlog/reconciliation.md section 2 (➕). Product behaviour with no existing
# story — see issue #63, section 3. Merged what were originally three stories (the unified
# balance concept, the filterable ledger, and the transaction detail page) into one: all
# three are facets of the single /wallet page and its detail view, and would ship together.
id: PAY-5
title: "/wallet: one balance, filterable ledger, and transaction detail"
description: "As a user, I want one wallet balance for top-ups, lesson payments, tutor earnings, refunds, and payouts, a filterable transaction list showing them all in one place, and a read-only detail page for each transaction, so that money is easy to understand and I never need separate Payments and Earnings pages."
epic: "Payments & Billing"
role: "user"
lifecycle: backlog
story_points: 8
dependencies: []
acceptance_criteria:
  - given: "any wallet-affecting event occurs,"
    when: "the ledger updates,"
    then: "the available balance reflects the same state everywhere it is shown."
  - given: "a user is both a Student and a Tutor,"
    when: "they view their wallet,"
    then: "top-up funds and cleared tutor earnings are shown in one available balance, not two."
  - given: "transactions of different types exist,"
    when: "/wallet opens,"
    then: "top-ups, lesson payments, class earnings, refunds, and payouts all appear in one filterable list."
  - given: "a transaction is opened,"
    when: "/wallet/transactions/:id loads,"
    then: "type, amount, direction, status, date, and the related booking (if any) are shown, read-only."
  - given: "the transaction is an unfinished lesson payment,"
    when: "/wallet/transactions/:id loads,"
    then: "it tells the user to pay from /bookings/:id instead of accepting payment here."
sources:
  - file: ../../sources/tutormatcher-prototype-user-stories.md
    locator: "Wallet, Payments & Payouts / US5-1, US5-6, US5-7"
journey:
  - route: "/wallet"
    action: "View one wallet balance, filterable ledger, and transaction detail"
