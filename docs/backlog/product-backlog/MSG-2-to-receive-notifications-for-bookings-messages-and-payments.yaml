    title: "Build the notification preferences settings UI"
    assignees: ["Ideal", "Pooh"]
    role: "Frontend"
    status: todo
    estimate_hours: 3
  - id: MSG-2-T2
    title: "Implement the event-based notification service (booking, message, payment)"
    assignees: ["Ideal", "Pooh"]
    role: "Backend"
    status: todo
    estimate_hours: 4
  - id: MSG-2-T3
    title: "Implement per-member preference filtering (respect disabled types)"
    assignees: ["Ideal", "Pooh"]
    role: "Backend"
    status: todo
    estimate_hours: 3
  - id: MSG-2-T4
    title: "Write acceptance tests for notifications (sent, suppressed)"
    assignees: ["Ideal", "Pooh"]
