# Reworded: docs/backlog/reconciliation.md marks this ⛔, and issue #63 resolves it as a
# rewrite, not a cancellation, because AUTH-2, AUTH-3, AUTH-4, AUTH-5, AUTH-6, PROF-1,
# PROF-2, PROF-3, and PROF-4 depend on this story's ID. There is no role choice at
# sign-up — every account is created as a Student; the Tutor capability is granted later
# through an approved application (see AUTH-4), not chosen here (docs/user-journeys.md).
id: AUTH-1
title: "Create an account"
description: "As a new member, I want to sign up with my first name, last name, email, and password, plus an optional bio, so that I get a Student account. (Becoming a Tutor is a separate, later application — see AUTH-4.)"
epic: "Account Registration & Authentication"
role: "new member"
lifecycle: backlog
story_points: 5
dependencies: []
acceptance_criteria:
  - given: "a visitor is on the sign-up page,"
    when: "they submit a valid first name, last name, email, AND password (bio is optional),"
    then: "a Student account is created and a verification email is sent."
  - given: "a visitor leaves a required field (first name, last name, email, or password) empty,"
    when: "they submit the sign-up form,"
    then: "the system shows a field-level error for each missing field and no account is created."
  - given: "the email is already registered,"
    when: "the visitor tries to sign up,"
    then: "the system shows an error and suggests logging in instead."
sprint: sprint-1
assignees: ["Nesta", "Washi"]
status: todo
order: 1
estimate_hours: 20
tasks:
  - id: AUTH-1-T1
    title: "Design the Student and Tutor sign-up page layouts"
    assignees: ["Nesta", "Washi"]
    role: UXUI
    status: todo
    estimate_hours: 2
  - id: AUTH-1-T2
    title: "Build the sign-up form (first name, last name, email, password, optional bio) and post-sign-up routing to the Student dashboard"
    assignees: ["Nesta", "Washi"]
    role: Frontend
    status: todo
    estimate_hours: 4
  - id: AUTH-1-T3
    title: "Implement required-field validation and the duplicate-email error message"
    assignees: ["Nesta", "Washi"]
    role: Frontend
    status: todo
    estimate_hours: 3
  - id: AUTH-1-T4
    title: "Create the member account database schema (Student by default; Tutor capability granted later)"
    assignees: ["Nesta", "Washi"]
    role: Backend
    status: todo
    estimate_hours: 2
  - id: AUTH-1-T5
    title: "Implement the registration API endpoint and email-uniqueness check"
    assignees: ["Nesta", "Washi"]
    role: Backend
    status: todo
    estimate_hours: 4
  - id: AUTH-1-T6
    title: "Implement the verification email flow"
    assignees: ["Nesta", "Washi"]
    role: Backend
    status: todo
    estimate_hours: 3
  - id: AUTH-1-T7
    title: "Write acceptance tests for sign-up (valid, missing required field, duplicate email)"
    assignees: ["Nesta", "Washi"]
    role: QA
    status: todo
    estimate_hours: 2

sources:
