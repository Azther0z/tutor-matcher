id: BOOK-4
title: "To cancel a lesson within the allowed policy window (Tutor)"
description: "As a Tutor, I want to cancel a lesson within the allowed policy window so that I can handle changes in my schedule while maintaining the Student's trust in the platform."
epic: "Lesson Booking & Scheduling"
role: "Tutor"
lifecycle: backlog
story_points: 3
dependencies: ["BOOK-1"]
acceptance_criteria:
  - given: "a lesson is more than 12 hours away,"
    when: "a Tutor cancels it,"
    then: "the cancellation is applied without penalty and the Student is refunded to their wallet balance."
  - given: "a lesson is within the 12-hour penalty window,"
    when: "a Tutor cancels it,"
    then: "the applicable policy is shown before confirmation, and any eligible refund is credited to the Student's wallet balance."
sprint: sprint-1
assignees: ["Santa", "Plai"]
status: todo
order: 17
estimate_hours: 12
