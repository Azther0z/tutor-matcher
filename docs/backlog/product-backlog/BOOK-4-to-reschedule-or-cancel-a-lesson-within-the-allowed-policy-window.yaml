  - id: BOOK-4-T2
    title: "Implement the 12-hour free-cancellation window and wallet refund logic for Tutor-initiated cancellation"
    assignees: ["Santa", "Plai"]
    role: "Backend"
    status: todo
    estimate_hours: 5
  - id: BOOK-4-T3
    title: "Write acceptance tests for Tutor cancellation (both time windows)"
