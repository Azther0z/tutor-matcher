# Reworded: docs/backlog/reconciliation.md marks this ✏️. Consent for identity documents,
# credentials, and payout data is given at the tutor **application** step
# (`/(auth)/enroll-tutor`), not at sign-up — sign-up itself only creates a Student account
# (docs/user-journeys.md).
id: AUTH-6
title: "Consent to privacy and data processing when applying to become a Tutor"
description: "As a Student applying to become a Tutor, I want to review and accept the Privacy Policy and Terms of Service, including how my identity documents, teaching credentials, and payout information will be processed, so that I understand and control how my sensitive data is used before I submit my application."
epic: "Account Registration & Authentication"
role: "Student"
lifecycle: backlog
story_points: 3
dependencies: ["AUTH-4"]
acceptance_criteria:
  - given: "a Student on the tutor application page has checked the consent checkbox,"
    when: "they submit the application,"
    then: "the application is submitted and the consent timestamp is recorded."
  - given: "a Student reaches the final step of the tutor application,"
    when: "they have not checked the consent checkbox covering identity, credential, AND payout data processing,"
    then: "the application cannot be submitted and the requirement is highlighted."
sprint: sprint-1
assignees: ["Ideal", "Pooh"]
status: todo
order: 7
estimate_hours: 12
