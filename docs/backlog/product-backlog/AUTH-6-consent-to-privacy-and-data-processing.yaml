    title: "Design the consent copy covering ID/payout data on the tutor application"
    assignees: ["Ideal", "Pooh"]
    role: "UXUI"
    status: todo
    estimate_hours: 3
  - id: AUTH-6-T2
    title: "Implement the consent-checkbox gate on the tutor application"
    assignees: ["Ideal", "Pooh"]
    role: "Frontend"
    status: todo
    estimate_hours: 3
  - id: AUTH-6-T3
    title: "Record the consent (ID, credentials, payout) with timestamp"
    assignees: ["Ideal", "Pooh"]
    role: "Backend"
    status: todo
    estimate_hours: 4
  - id: AUTH-6-T4
    title: "Write acceptance tests for the tutor-application consent gate"
