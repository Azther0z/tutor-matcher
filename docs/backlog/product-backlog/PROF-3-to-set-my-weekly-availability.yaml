# Reworded: docs/backlog/reconciliation.md marks this ✏️. Availability is set per date as
# 30-minute slots, with one or more of the tutor's subjects assigned to each open slot.
# There is no weekly recurrence (docs/user-journeys.md).
#
# Dependency fix (same reconciliation pass): dropped the direct AUTH-1 dependency — see
# PROF-2's comment for why AUTH-1 alone no longer implies the Tutor capability. PROF-2
# already depends on AUTH-4, so it carries that transitively.
id: PROF-3
title: "To set my availability"
description: "As a Tutor, I want to open 30-minute slots on specific dates and assign subjects to each one so that students only see bookable, subject-specific slots."
epic: "User Profile Management"
role: "Tutor"
lifecycle: backlog
story_points: 3
dependencies: ["PROF-2"]
acceptance_criteria:
  - given: "a Tutor opens a 30-minute slot on a specific date and assigns one or more subjects to it,"
    when: "saved,"
    then: "only that open, subject-assigned slot appears to students on that date."
  - given: "a Tutor enters an availability slot that overlaps an existing slot on the same date,"
    when: "they save the availability calendar,"
    then: "the overlapping slot is rejected and an error is shown."
sprint: sprint-1
assignees: ["Poom", "Pee"]
status: todo
order: 10
estimate_hours: 12
tasks:
  - id: PROF-3-T1
    title: "Design the per-date availability calendar UI"
    assignees: ["Poom", "Pee"]
    role: "UXUI"
    status: todo
    estimate_hours: 2
  - id: PROF-3-T2
    title: "Build the per-date, 30-minute slot calendar with slot selection"
    assignees: ["Poom", "Pee"]
    role: "Frontend"
    status: todo
    estimate_hours: 3
  - id: PROF-3-T3
    title: "Implement overlap detection and slot storage"
    assignees: ["Poom", "Pee"]
    role: "Backend"
    status: todo
    estimate_hours: 3
  - id: PROF-3-T4
    title: "Expose open slots to search and booking"
    assignees: ["Poom", "Pee"]
    role: "Backend"
    status: todo
    estimate_hours: 2
  - id: PROF-3-T5
    title: "Write acceptance tests for availability (valid, overlapping slots)"
    assignees: ["Poom", "Pee"]
    role: "QA"
    status: todo
    estimate_hours: 2

sources:
  - file: ../../sources/Product Backlog v1.2.html
    locator: "User Profile Management / US2-3"
journey:
  - route: "/settings/tutor"
    action: "Update availability"
