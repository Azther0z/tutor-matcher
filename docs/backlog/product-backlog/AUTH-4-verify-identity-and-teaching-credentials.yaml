    estimate_hours: 3
  - id: AUTH-4-T2
    title: "Build the ID/certificate URL form"
    assignees: ["Ideal", "Pooh"]
    role: "Frontend"
    status: todo
    estimate_hours: 4
  - id: AUTH-4-T3
    title: "Store document URLs and grant the Tutor capability immediately"
    assignees: ["Ideal", "Pooh"]
