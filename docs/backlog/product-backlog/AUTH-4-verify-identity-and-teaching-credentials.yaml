# Reworded: docs/backlog/reconciliation.md marks this ✏️. The applicant is a logged-in
# Student, not yet a Tutor. Submission requires a government ID, a teaching certification,
# AND a bio, and the Tutor capability is granted only on admin approval
# (docs/user-journeys.md, tutor application).
id: AUTH-4
title: "Apply to become a Tutor with identity and teaching credentials"
description: "As a logged-in Student, I want to apply to become a Tutor by submitting a government ID, a teaching certification, and a bio, so that I can be reviewed and, once approved, teach on the platform."
epic: "Account Registration & Authentication"
role: "Student"
lifecycle: backlog
story_points: 5
dependencies: ["AUTH-1"]
acceptance_criteria:
  - given: "a logged-in Student opens the tutor application and submits a government ID, a teaching certification, AND a bio,"
    when: "the application is submitted,"
    then: "it is marked 'Pending Verification' until an admin reviews it, and the Tutor capability is not granted yet — no separate account is created or removed."
  - given: "the admin approves the application,"
    when: "review completes,"
    then: "the account is granted the Tutor capability and the profile displays a 'Verified' badge."
sprint: sprint-1
assignees: ["Ideal", "Pooh"]
status: todo
order: 4
estimate_hours: 20
tasks:
  - id: AUTH-4-T1
    title: "Design the tutor-application form and verification-status UI"
    assignees: ["Ideal", "Pooh"]
    role: "UXUI"
    status: todo
    estimate_hours: 3
  - id: AUTH-4-T2
    title: "Build the ID/certification/bio upload form"
    assignees: ["Ideal", "Pooh"]
    role: "Frontend"
    status: todo
    estimate_hours: 4
  - id: AUTH-4-T3
    title: "Implement document storage and 'Pending Verification' status"
    assignees: ["Ideal", "Pooh"]
    role: "Backend"
    status: todo
    estimate_hours: 6
  - id: AUTH-4-T4
    title: "Implement the admin approval workflow that grants the Tutor capability and 'Verified' badge"
    assignees: ["Ideal", "Pooh"]
    role: "Backend"
    status: todo
    estimate_hours: 5
  - id: AUTH-4-T5
    title: "Write acceptance tests for the tutor application flow"
    assignees: ["Ideal", "Pooh"]
    role: "QA"
    status: todo
    estimate_hours: 2

sources:
