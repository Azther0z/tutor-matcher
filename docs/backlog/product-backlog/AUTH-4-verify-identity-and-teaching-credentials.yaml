id: AUTH-4
title: "Verify identity and teaching credentials"
description: "As a Tutor, I want to verify my identity and teaching credentials so that students can trust my profile."
epic: "Account Registration & Authentication"
role: "Tutor"
lifecycle: backlog
story_points: 5
dependencies: ["AUTH-1"]
acceptance_criteria:
  - given: "a Tutor uploads an ID and certificates,"
    when: "submitted,"
    then: "the status shows 'Pending Verification' until an admin reviews it."
  - given: "the admin approves the documents,"
    when: "review completes,"
    then: "the Tutor profile displays a 'Verified' badge."
sources:
  - file: ../../sources/Product Backlog v1.2.html
    locator: "Account Registration & Authentication / US1-4"
journey:
  - route: "(auth)/enroll-tutor"
    action: "Upload ID, certification"
