id: AUTH-4
title: "Submit identity and teaching credentials"
description: "As a Student, I want to submit my identity and teaching credentials so that I can become a Tutor."
epic: "Account Registration & Authentication"
role: "Student"
lifecycle: backlog
story_points: 5
dependencies: ["AUTH-1"]
acceptance_criteria:
  - given: "a logged-in Student provides an ID URL, certification URL, and Tutor bio,"
    when: "submitted,"
    then: "the Tutor capability is granted immediately and the Tutor status starts as 'Unpublished'."
  - given: "the application contains the submitted identity and certification URLs,"
    when: "the Tutor profile is saved,"
    then: "the URLs are retained as document references without requiring file storage."
sprint: sprint-1
assignees: ["Ideal", "Pooh"]
status: todo
order: 3
estimate_hours: 20
