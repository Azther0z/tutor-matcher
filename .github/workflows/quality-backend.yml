name: Quality Backend

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'docker-compose.yml'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'apps/backend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'docker-compose.yml'
      - '.github/workflows/**'

concurrency:
  group: tutor-matcher-quality-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - working-directory: apps/backend
        run: npm ci
      - working-directory: apps/backend
        run: npm run lint
      - working-directory: apps/backend
        run: npm test -- --runInBand --passWithNoTests
      - working-directory: apps/backend
        run: npm run test:bdd
      - working-directory: apps/backend
        run: npm run build
