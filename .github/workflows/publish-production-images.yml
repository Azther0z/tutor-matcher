name: Publish Production Images

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "apps/frontend/**"
      - "deploy/compose.yaml"
      - ".github/workflows/publish-production-images.yml"
  workflow_dispatch:

concurrency:
  group: tutor-matcher-publish-production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  COMPOSE_FILE: deploy/compose.yaml

jobs:
  publish:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate production Compose
        run: docker compose -f "$COMPOSE_FILE" config --quiet

      - name: Build production images
        run: docker compose -f "$COMPOSE_FILE" build frontend backend

      - name: Tag and push production images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -eu

          compose_config=$(docker compose -f "$COMPOSE_FILE" config --format json)

          for service in frontend backend; do
            image=$(jq -r ".services.${service}.image" <<< "$compose_config")
            test "$image" != "null"

            repository=${image%:*}
            docker tag "$image" "$repository:$IMAGE_TAG"
            docker push "$image"
            docker push "$repository:$IMAGE_TAG"
          done
