name: Deploy Backlog Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/backlog/**"
      - "docs/sources/**"
      - "scripts/validate-backlog.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-backlog-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run backlog:check
      - uses: actions/configure-pages@v5
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp docs/backlog/backlog.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
