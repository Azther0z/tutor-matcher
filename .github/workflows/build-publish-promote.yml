name: Build, Publish, Promote

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tutor-matcher-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  FRONTEND_IMAGE: docker.io/azther0z/tutor-matcher-frontend
  BACKEND_IMAGE: docker.io/azther0z/tutor-matcher-backend

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: npm ci

      - name: Lint ${{ matrix.app }}
        working-directory: apps/${{ matrix.app }}
        run: npm run lint

      - name: Test ${{ matrix.app }}
        working-directory: apps/${{ matrix.app }}
        run: npm test -- --runInBand --passWithNoTests

      - name: Test backend behavior
        if: matrix.app == 'backend'
        working-directory: apps/backend
        run: npm run test:bdd

      - name: Build ${{ matrix.app }}
        working-directory: apps/${{ matrix.app }}
        run: npm run build

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  container:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          push: false
          tags: tutor-matcher/${{ matrix.app }}:ci

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, format, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        id: build_frontend
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

      - name: Build and push backend image
        id: build_backend
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Verify pushed manifests
        run: |
          docker buildx imagetools inspect "$FRONTEND_IMAGE:$GITHUB_SHA" >/dev/null
          docker buildx imagetools inspect "$BACKEND_IMAGE:$GITHUB_SHA" >/dev/null
