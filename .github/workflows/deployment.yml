name: Deployment Configuration

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - ".doco-cd.yaml"
  pull_request:
    paths:
      - "deploy/**"
      - ".doco-cd.yaml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and image references
        working-directory: deploy
        run: |
          printf 'postgresql://postgres:ci@postgres:5432/tutor_matcher\n' > secrets/backend_database_url.enc
          printf 'ci\n' > secrets/postgres_password.enc
          docker compose -f compose.yaml config >/dev/null
          config=$(docker compose -f compose.yaml config --format json)
          jq -e '
            .services.gateway.image == "caddy:2-alpine" and
            .services.gateway.ports[0].target == 80 and
            .services.gateway.ports[0].published == "3333" and
            .services.frontend.image == "docker.io/azther0z/tutor-matcher-frontend:latest" and
            any(.services.frontend.expose[]; tostring == "3000") and
            .services.backend.image == "docker.io/azther0z/tutor-matcher-backend:latest" and
            any(.services.backend.expose[]; tostring == "8000")
          ' >/dev/null <<< "$config"
          docker run --rm --entrypoint caddy \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine validate --config /etc/caddy/Caddyfile
