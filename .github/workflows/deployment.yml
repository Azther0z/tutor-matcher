name: Deployment Configuration

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - ".doco-cd.yaml"
  pull_request:
    paths:
      - "deploy/**"
      - ".doco-cd.yaml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and image references
        working-directory: deploy
        run: |
          printf 'postgresql://postgres:ci@postgres:5432/tutor_matcher\n' > secrets/backend_database_url.enc.txt
          printf 'ci\n' > secrets/postgres_password.enc.txt
          docker compose -f compose.yaml config >/dev/null
          images=$(docker compose -f compose.yaml config --images)
          grep -Fx 'docker.io/azther0z/tutor-matcher-frontend:latest' <<< "$images"
          grep -Fx 'docker.io/azther0z/tutor-matcher-backend:latest' <<< "$images"
