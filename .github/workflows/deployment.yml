name: Deployment Configuration

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - ".doco-cd.yaml"
      - ".github/workflows/deployment.yml"
      - ".github/scripts/validate-deploy-compose.sh"
  pull_request:
    paths:
      - "deploy/**"
      - ".doco-cd.yaml"
      - ".github/workflows/deployment.yml"
      - ".github/scripts/validate-deploy-compose.sh"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and image references
        run: |
          docker compose version
          yq --version
          .github/scripts/validate-deploy-compose.sh
