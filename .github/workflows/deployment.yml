name: Deployment Configuration

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - ".doco-cd.yaml"
  pull_request:
    paths:
      - "deploy/**"
      - ".doco-cd.yaml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and image references
        working-directory: deploy
        run: |
          printf 'DATABASE_URL=postgresql://postgres:ci@postgres:5432/tutor_matcher\n' > secrets/backend.enc.env
          printf 'POSTGRES_PASSWORD=ci\n' > secrets/postgres.enc.env
          docker compose -f compose.yaml config >/dev/null
          config=$(docker compose -f compose.yaml config --format json)
          jq -e '
            .services.frontend.image == "docker.io/azther0z/tutor-matcher-frontend:latest" and
            .services.frontend.build.args.BACKEND_URL == "http://backend:8000" and
            .services.frontend.ports[0].target == 3000 and
            .services.frontend.ports[0].published == "3333" and
            .services.backend.image == "docker.io/azther0z/tutor-matcher-backend:latest" and
            .services.backend.ports[0].target == 8000 and
            .services.backend.ports[0].published == "8000"
          ' >/dev/null <<< "$config"
